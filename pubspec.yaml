name: justus
description: "Private 2-Person Dual-PIN Chat App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8

  # State Management
  riverpod: ^3.5.0
  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8

  # Navigation
  go_router: ^18.1.3

  # Local Database
  drift: ^2.35.3
  drift_flutter: ^0.3.1

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # Supabase
  supabase_flutter: ^2.8.1

  # Background Tasks
  workmanager: ^0.10.10

  # Push Notifications
  firebase_messaging: ^15.1.4
  flutter_local_notifications: ^18.0.1
  firebase_core: ^3.6.0

  # Image Handling
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  image: ^4.3.0

  # Audio
  record: ^5.1.1
  just_audio: ^0.10.3

  # Video
  video_player: ^2.9.2

  # Screen Security
  flutter_windowmanager_plus: ^1.0.1
  secure_application: ^4.1.0

  # Encryption
  encrypt: ^5.0.3
  pointycastle: ^3.8.5

  # Environment
  flutter_dotenv: ^5.2.1

  # Logging
  logger: ^2.5.0

  # JSON Serialization
  json_annotation: ^4.9.0

  # Equatable for domain models
  equatable: ^2.0.7

  # Freezed for sealed classes
  freezed_annotation: ^3.0.0

  # Utilities
  package_info_plus: ^8.1.1
  connectivity_plus: ^6.1.0
  path_provider: ^2.1.5
  share_plus: ^10.1.2
  file_picker: ^8.1.6
  uuid: ^4.5.1
  bcrypt: ^1.1.3
  stream_transform: ^2.1.0
  path: ^1.9.0
  haptic_feedback: ^0.4.2
  flutter_svg: ^2.3.2
  flutter_compass: ^0.8.1

dependency_overrides:
  record_linux: ^1.2.1
  workmanager: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  drift_dev: ^2.35.2
  riverpod_generator: ^4.0.10
  riverpod_lint: ^3.0.0
  # custom_lint: ^0.7.3  # Temporarily disabled due to version conflicts
  json_serializable: ^6.13.0
  freezed: ^4.0.3
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/.env
    - assets/images/
    - assets/icons/
    - assets/audio/notification.aac

  # Fonts
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700